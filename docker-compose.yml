services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: acadence-postgres
    environment:
      POSTGRES_DB: acadence
      POSTGRES_USER: acadence
      POSTGRES_PASSWORD: acadence
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acadence -d acadence"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: acadence-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://acadence:acadence@postgres:5432/acadence
      DB_SCHEMA: student_app
      VITE_API_BASE_URL: https://localhost
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      ACCESS_TOKEN_TTL_SECONDS: 1800
      REFRESH_TOKEN_TTL_SECONDS: 1209600
      EMBEDDING_PROVIDER: local
      AI_VECTOR_DIMENSION: 384
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: acadence-frontend
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: acadence-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/ssl
    restart: unless-stopped
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
