name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acadence_test
        # no host port mapping necessary — Actions exposes the service on localhost
        options: >-
          --health-cmd "pg_isready -U postgres -d acadence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl

      - name: Install Python deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/acadence_test
          PGVECTOR_ENABLED: 'false'
          PGPASSWORD: postgres
        run: |
          set -e
          echo "Waiting for Postgres to be ready..."
          for i in {1..60}; do
            pg_isready -h localhost -p 5432 -U postgres -d acadence_test && break || sleep 1
          done

          echo "Starting API server in background (uvicorn)..."
          nohup python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 > uv_out.log 2> uv_err.log &

          echo "Waiting for /health to respond..."
          for i in {1..60}; do
            if curl -sSf http://localhost:8000/health >/dev/null 2>&1; then
              echo "API is up" && break
            fi
            sleep 1
          done

          echo "uvicorn stderr (last 200 lines):" || true
          tail -n 200 uv_err.log || true

          python -m pytest -q
